# Stack de produção — 4 containers (não 6 como o legacy): db, redis, app, nginx.
# Sem `worker`/`telegram-worker` separados — current/ roda tudo (deposit-verifier,
# withdrawal-auto-send, telegram-outbox, crons de limpeza, etc.) como cron in-process
# dentro do próprio `app`, decisão documentada em docs/PROGRESSO.txt (item 10c e
# reiterada em cada cron portado depois). Um processo a menos pra buildar/monitorar/
# atualizar — sem symlink _server_vendor pra sincronizar entre eles, porque não existem.
#
# Cobre tanto "teste local" quanto "VM compartilhada" NUM arquivo só (elimina o
# docker-compose.local.yml do legacy) via as mesmas variáveis de porta parametrizadas
# que o nginx.vm5000.conf já usa — pra testar sem nginx na frente, suba só os serviços
# que precisa: `docker compose up db redis app`.
#
# Uso: docker compose up -d
name: blockminer-current

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    container_name: blockminer-current-db
    image: postgres:15-alpine
    logging: *default-logging
    environment:
      POSTGRES_USER: blockminer
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: blockminer
    ports:
      - "${DB_PUBLISH_PORT:-127.0.0.1:5432}:5432"
    volumes:
      - blockminer_current_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockminer -d blockminer"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    container_name: blockminer-current-redis
    image: redis:7-alpine
    logging: *default-logging
    ports:
      - "${REDIS_PUBLISH_PORT:-127.0.0.1:6379}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # KRaft single-node Kafka (no ZooKeeper) — Stats earnings bus (bm.earnings.v1).
  # bitnami/kafka tags moved to bitnamilegacy/* (Aug 2025 catalog change).
  kafka:
    container_name: blockminer-current-kafka
    image: bitnamilegacy/kafka:3.9.0-debian-12-r13
    logging: *default-logging
    ports:
      - "${KAFKA_PUBLISH_PORT:-127.0.0.1:9092}:9092"
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - blockminer_current_kafka:/bitnami/kafka
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  app:
    container_name: blockminer-current-app
    logging: *default-logging
    build:
      context: .
      args:
        # Baked at frontend build, not runtime — must be in the shell env or passed via
        # `docker compose --env-file .env.production build app` (ver Dockerfile).
        VITE_WALLETCONNECT_PROJECT_ID: ${VITE_WALLETCONNECT_PROJECT_ID:-}
    ports:
      - "${APP_PUBLISH_PORT:-127.0.0.1:3000}:3000"
    stop_grace_period: 180s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - .env.production
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://blockminer:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/blockminer?schema=public"
      # Hardcoded (not `${REDIS_URL:-...}`) on purpose: this always resolves via Docker's internal
      # DNS to the `redis` service in THIS compose file — there's no legitimate reason to override
      # it. A `${VAR:-default}` here previously read the ambient current/.env (Compose auto-loads
      # that file for its own variable substitution, unrelated to the app's env_file: block above)
      # and silently picked up the local dev Redis port (127.0.0.1:6380) instead — found by
      # actually booting this stack end-to-end (docker-compose.yml + Dockerfile), not by unit tests.
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "kafka:9092"
      # Trust X-Forwarded-For do nginx — sem isso os rate limiters/fraud-signals usam o
      # IP do container do nginx, não o do usuário real (ver nginx/nginx.vm5000.conf).
      TRUST_PROXY: "true"
    volumes:
      - ./storage:/app/storage
      # Hand-patched SPA assets (index-inv2plusN.js, broadcast-popup, integrity, …).
      # Without this bind, `docker compose up --force-recreate` resets to the image
      # build and every /assets/* URL 404s until someone docker-cp's again.
      - ./client/dist:/app/client/dist
      # Server patches (CSRF exempts, antibot, spaStatic) — same recreate problem.
      - ./dist:/app/dist
      # Prisma schema/migrations — image bake is stale (Sep 2); without this bind,
      # `prisma generate` after recreate misses fields like User.satspaySubject and
      # SatsPay login returns INTERNAL_ERROR.
      - ./prisma:/app/prisma
    restart: unless-stopped

  # Materializes bm.earnings.v1 into user_stats_earnings_* for GET /api/stats/earnings.
  stats-materializer:
    container_name: blockminer-current-stats-materializer
    logging: *default-logging
    image: blockminer-current-app:latest
    command: ["node", "dist/server/bootstrap/statsMaterializer.js"]
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - .env.production
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://blockminer:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/blockminer?schema=public"
      KAFKA_BROKERS: "kafka:9092"
      ROLE: "stats-materializer"
    restart: unless-stopped

  # Depósito HD custodial (docs/PROGRESSO.txt item 67) — o ÚNICO processo de todo o stack
  # que segura POLYGON_HD_MNEMONIC (chave que controla fundos reais). Reusa a MESMA imagem
  # do `app` (sem build/Dockerfile próprio), só troca o `command:`. Sem `ports:` publicado
  # pro host nem rota de nginx — só alcançável pelo `app` via rede interna do Docker
  # (http://phd:3847), autenticado por PHD_INTERNAL_TOKEN. NUNCA adicione este serviço a
  # `env_file: .env.production` do jeito que `app` faz — a mnemonic fica só nas env vars
  # explícitas abaixo, escopadas ao mínimo necessário.
  phd:
    container_name: blockminer-current-phd
    logging: *default-logging
    # Reuses the already-built `app` image by name (no `build:` block here) — same tree,
    # same dist/, just a different CMD. Avoids building the whole image twice.
    image: blockminer-current-app:latest
    command: ["node", "dist/server/phd-bootstrap/phdServer.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://blockminer:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/blockminer?schema=public"
      PHD_PORT: "${PHD_PORT:-3847}"
      PHD_INTERNAL_TOKEN: "${PHD_INTERNAL_TOKEN:?set PHD_INTERNAL_TOKEN in .env}"
      POLYGON_HD_MNEMONIC: "${POLYGON_HD_MNEMONIC:?set POLYGON_HD_MNEMONIC in .env}"
      POLYGON_RPC_URL: "${POLYGON_RPC_URL:-https://polygon-bor-rpc.publicnode.com}"
      POLYGON_HD_SWEEP_TO_ADDRESS: "${POLYGON_HD_SWEEP_TO_ADDRESS:-}"
      POLYGON_HD_AUTO_SWEEP: "${POLYGON_HD_AUTO_SWEEP:-}"
      POLYGON_HD_SWEEP_CRON_MS: "${POLYGON_HD_SWEEP_CRON_MS:-}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    container_name: blockminer-current-nginx
    image: nginx:alpine
    logging: *default-logging
    # VM compartilhada é a topologia real confirmada (docs/PROGRESSO.txt item 12e) — por
    # isso é o DEFAULT abaixo, não uma exceção a lembrar de configurar: nginx.vm5000.conf
    # (o único nginx.conf que existe nesta árvore) escuta 5100 internamente, então o
    # default de publish tem que bater com isso, senão nginx sobe mas nada responde (bug
    # real encontrado testando esta stack de ponta a ponta — porta 80:80 não bate com
    # `listen 5100` do arquivo). Porta 443 fica "morta" de propósito (sem TLS aqui, quem
    # termina é o proxy compartilhado/Cloudflare na frente). Se um dia migrar pra VM
    # dedicada com TLS próprio, sobrescreva as duas env vars E troque NGINX_CONF_FILE pra
    # um nginx.conf que escute 80/443 de verdade (ainda não existe nesta árvore).
    ports:
      - "${NGINX_HTTP_PUBLISH:-5000:5100}"
      - "${NGINX_HTTPS_PUBLISH:-127.0.0.1:5443:5443}"
    volumes:
      - ${NGINX_CONF_FILE:-./nginx/nginx.vm5000.conf}:/etc/nginx/nginx.conf:ro
      - ./nginx/includes:/etc/nginx/includes:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  blockminer_current_data:
  blockminer_current_kafka:
