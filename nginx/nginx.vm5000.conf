### BlockMiner (current/) — VM COMPARTILHADA (outros sites no mesmo host).
### Escuta 5100 dentro do container, publicado como 5000 no host.
### NÃO termina TLS: um proxy compartilhado (ou Cloudflare) na frente faz isso
### e encaminha para 127.0.0.1:5000. Por isso aqui não há certificado nem :443.
###
### Ported from legacy/nginx/nginx.vm5000.conf — conteúdo idêntico (é infra
### genérica de proxy, não específica de versão do app). Único ajuste real:
### comentários atualizados pra refletir current/. current/ ainda NÃO tem
### Dockerfile nem serviço "app" no docker-compose — este arquivo já está
### pronto pro dia em que isso existir (ver nota no fim do arquivo).
###
### Ativar com, no .env:
###   NGINX_CONF_FILE=./nginx/nginx.vm5000.conf
###   NGINX_HTTP_PUBLISH=5000:5100
###   NGINX_HTTPS_PUBLISH=127.0.0.1:5443:5443   (porta morta — evita 443 nesta VM)

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 12m;

    # CSP do app passa dos 4KB (ver current/server/core/http/middleware/csp.ts,
    # PROGRESSO.txt item 11i) — sem isso o upstream estoura o buffer.
    proxy_buffer_size 64k;
    proxy_buffers 8 64k;
    proxy_busy_buffers_size 128k;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # O IP real do usuário chega no X-Forwarded-For do proxy da frente.
    # Sem estas duas linhas o nginx grava o IP do PROXY como $remote_addr — no
    # legacy isso fez 60 contas registrarem o IP do container (172.18.0.x) e
    # dispararem alerta falso de multi-conta no painel admin (ver
    # current/server/modules/admin/admin.multi-account-risk.ts, PROGRESSO.txt
    # item 10h — a mesma classe de falso-positivo se repete aqui sem isso).
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # DNS embutido do Docker + variável no proxy_pass: adia a resolução para o
    # momento do request. Com `upstream` estático o nginx se RECUSA a iniciar se
    # o app estiver fora — numa VM compartilhada isso derrubaria o proxy inteiro.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    map $host $bm_app { default "app"; }

    server {
        listen 5100 default_server;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        # O app define CSP frame-ancestors; deixar o X-Frame-Options do upstream passar atrapalha.
        proxy_hide_header X-Frame-Options;

        # Vite hashed chunks — immutable. Temporary inv2plus* compat gen stays
        # no-cache so stale cached clients can still fetch tabs without sticky 404s.
        # After SPA_COMPAT_KEEP is cleared, the inv2plus nested location can go.
        location ^~ /assets/ {
            proxy_pass http://$bm_app:3000$request_uri;
            include /etc/nginx/includes/proxy-headers.conf;
            proxy_hide_header Vary;
            add_header Vary "Accept-Encoding" always;

            # Do NOT stamp immutable on error responses (404 JSON from the app). Sticky CDN
            # 404s made missing assets unrecoverable.
            proxy_intercept_errors on;
            error_page 404 = @bm_asset_miss;

            expires 1y;
            add_header Cache-Control "public, immutable" always;

            # Compat only (cached entry index-inv2plus115.js etc.)
            location ~ ^/assets/[^/]*-inv2plus[0-9]+\.(m?js|css)$ {
                proxy_pass http://$bm_app:3000$request_uri;
                include /etc/nginx/includes/proxy-headers.conf;
                proxy_hide_header Vary;
                add_header Vary "Accept-Encoding" always;
                proxy_intercept_errors on;
                error_page 404 = @bm_asset_miss;
                expires off;
                add_header Cache-Control "public, no-cache, must-revalidate" always;
                add_header CDN-Cache-Control "no-cache" always;
            }
        }

        location @bm_asset_miss {
            default_type application/json;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header CDN-Cache-Control "no-store" always;
            return 404 '{"ok":false,"code":"ASSET_NOT_FOUND","message":"Asset não encontrado."}';
        }

        location ^~ /socket.io/ {
            proxy_pass http://$bm_app:3000$request_uri;
            include /etc/nginx/includes/proxy-headers.conf;
            include /etc/nginx/includes/proxy-websocket.conf;
            # Conexões longas — 15 min, igual à VM antiga.
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }

        # SPA shell — never long-cache index.html.
        location = /index.html {
            proxy_pass http://$bm_app:3000$request_uri;
            include /etc/nginx/includes/proxy-headers.conf;
            expires off;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header CDN-Cache-Control "no-store" always;
        }

        location / {
            proxy_pass http://$bm_app:3000$request_uri;
            include /etc/nginx/includes/proxy-headers.conf;
            include /etc/nginx/includes/proxy-websocket.conf;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}

### PENDÊNCIA REAL (não fabricada): current/ ainda não tem Dockerfile nem um
### serviço "app" definido em nenhum docker-compose — o $bm_app acima resolve
### pro nome do serviço Docker do app, que ainda não existe nesta árvore.
### docker-compose.dev.yml de current/ hoje só sobe db-dev + redis-dev (bancos
### de desenvolvimento local, fora deste proxy). Migrar o Dockerfile/serviço
### "app" real é um passo separado, não incluído nesta migração de nginx.
