# Shared proxy headers for every BlockMiner location. The real client IP arrives in the front
# proxy's X-Forwarded-For (see set_real_ip_from in the site config); X-Forwarded-Proto is passed
# through from that proxy. Included by nginx.vm5000.conf.
# Ported from legacy/nginx/includes/proxy-headers.conf (unchanged — generic, not app-specific).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
