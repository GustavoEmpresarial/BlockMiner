# WebSocket upgrade headers — include alongside proxy-headers.conf on locations that carry
# Socket.IO or any Upgrade traffic (/, /socket.io/). $connection_upgrade is mapped in the site config.
# Ported from legacy/nginx/includes/proxy-websocket.conf (unchanged — generic, not app-specific).
# current/'s Socket.IO layer (server/core/socket/, ported in PROGRESSO.txt item 12c) mounts on the
# same HTTP server as the Express app, same /socket.io/ path convention as legacy — this include
# applies unchanged.
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
