# Copy to secret.yaml locally (gitignored pattern) or create via:
# kubectl -n blockminer create secret generic blockminer-secrets \
#   --from-literal=DB_PASSWORD=... --from-literal=DATABASE_URL=postgresql://...
apiVersion: v1
kind: Secret
metadata:
  name: blockminer-secrets
  namespace: blockminer
type: Opaque
stringData:
  DB_PASSWORD: "CHANGE_ME"
  DATABASE_URL: "postgresql://blockminer:CHANGE_ME@postgres:5432/blockminer?schema=public"
  PHD_INTERNAL_TOKEN: "CHANGE_ME"
  POLYGON_HD_MNEMONIC: "CHANGE_ME word word word word word word word word word word word word"
