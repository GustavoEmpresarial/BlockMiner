apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: blockminer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: blockminer-current-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: blockminer-config
            - secretRef:
                name: blockminer-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: blockminer
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: app
